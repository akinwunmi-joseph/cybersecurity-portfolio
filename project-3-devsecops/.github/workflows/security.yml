name: DevSecOps Security Pipeline

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:

  # ── 1. Secrets Detection ──────────────────────────────────────────────────
  secrets-scan:
    name: 🔑 Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git log scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Static Application Security Testing (SAST) ────────────────────────
  sast:
    name: 🔍 SAST — Bandit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: |
          bandit -r . \
            --exclude './.git,./project-2-anomaly-detection' \
            --format json \
            --output bandit-report.json \
            --severity-level medium || true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Show Summary
        run: |
          echo "### Bandit SAST Results" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json, sys
          with open('bandit-report.json') as f:
            r = json.load(f)
          results = r.get('results', [])
          metrics = r.get('metrics', {}).get('_totals', {})
          print(f'Total issues: {len(results)}')
          print(f'HIGH severity: {metrics.get(\"SEVERITY.HIGH\", 0)}')
          print(f'MEDIUM severity: {metrics.get(\"SEVERITY.MEDIUM\", 0)}')
          print(f'LOW severity: {metrics.get(\"SEVERITY.LOW\", 0)}')
          if any(i[\"issue_severity\"] == \"HIGH\" for i in results):
              print(\"FATAL: HIGH severity issues found.\")
              sys.exit(1)
          "

  # ── 3. Dependency Vulnerability Scan ─────────────────────────────────────
  dependency-scan:
    name: 📦 Dependency Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit project-2 dependencies
        run: |
          pip-audit -r project-2-anomaly-detection/requirements.txt \
            --format json \
            --output pip-audit-report.json || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  # ── 4. Container Scanning (Trivy) ─────────────────────────────────────────
  container-scan:
    name: 🐳 Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: project-3-devsecops
        run: docker build -t devsecops-app:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"   # Fail pipeline on CRITICAL/HIGH CVEs
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ── 5. Infrastructure as Code Scan (Checkov) ──────────────────────────────
  iac-scan:
    name: 🏗️ IaC Scan (Checkov — Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov on Dockerfile
        uses: bridgecrewio/checkov-action@master
        with:
          directory: project-3-devsecops
          framework: dockerfile
          soft_fail: true   # Report but don't block on IaC issues (adjust as needed)

  # ── Summary Gate ──────────────────────────────────────────────────────────
  security-gate:
    name: ✅ Security Gate
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast, dependency-scan, container-scan, iac-scan]
    if: always()
    steps:
      - name: Check all security jobs passed
        run: |
          echo "All security scans completed."
          echo "secrets-scan:     ${{ needs.secrets-scan.result }}"
          echo "sast:             ${{ needs.sast.result }}"
          echo "dependency-scan:  ${{ needs.dependency-scan.result }}"
          echo "container-scan:   ${{ needs.container-scan.result }}"
          echo "iac-scan:         ${{ needs.iac-scan.result }}"

          if [[ "${{ needs.secrets-scan.result }}" == "failure" || \
                "${{ needs.sast.result }}"         == "failure" || \
                "${{ needs.container-scan.result }}" == "failure" ]]; then
            echo "❌ Critical security gate failed — deployment blocked."
            exit 1
          fi

          echo "✅ Security gate passed — safe to deploy."
